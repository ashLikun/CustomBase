apply plugin: 'com.android.library'
apply plugin: 'maven-publish'
android {
    publishing {
        singleVariant('release')
    }
    namespace 'com.ashlikun.core'
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        minSdk rootProject.ext.minSdkVersion
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName
        multiDexEnabled = true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    //java8
    compileOptions {
        //定义生成的META-INF/library_release文件名 More than one file was found with OS independent path 'META-INF/library_release.kotlin_module'
//        kotlinOptions.freeCompilerArgs += ['-module-name', 'com.ashlikun.core']
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
    compileOnly rootProject.ext.designVersion
    compileOnly 'com.github.ashLikun.frame:supertoobar:3.0.0'
    compileOnly 'com.github.ashLikun:CommonUtils:+'
    compileOnly 'com.github.ashLikun:CircleProgressView:2.0.1'
    compileOnly 'com.github.ashLikun:CustomDialog:2.0.2'
    compileOnly 'com.github.ashLikun:LoadSwitch:2.0.3'
    compileOnly 'com.github.ashLikun:OkHttpUtils:2.2.7'
    compileOnly 'com.alibaba:arouter-api:+'
}

apply from: '../maven.gradle'